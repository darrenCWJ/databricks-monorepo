# GitLab CI — top-level pipeline.
# Per-stage definitions live under .gitlab/ci/.

stages:
  - lint
  - test
  - bundle-validate
  - security
  - deploy-dev
  - deploy-staging
  - deploy-prod

include:
  - local: .gitlab/ci/lint.yml
  - local: .gitlab/ci/test.yml
  - local: .gitlab/ci/bundle-validate.yml
  - local: .gitlab/ci/security.yml
  - local: .gitlab/ci/deploy.yml

variables:
  UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
