build-ci-base:
  stage: .pre
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - changes:
        - .gitlab/ci/Dockerfile.ci-base
      when: always
    - when: manual
      allow_failure: true
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - >
      docker build
      -f .gitlab/ci/Dockerfile.ci-base
      -t "$CI_REGISTRY_IMAGE/ci-base:latest"
      -t "$CI_REGISTRY_IMAGE/ci-base:$CI_COMMIT_SHORT_SHA"
      .
    - docker push "$CI_REGISTRY_IMAGE/ci-base:latest"
    - docker push "$CI_REGISTRY_IMAGE/ci-base:$CI_COMMIT_SHORT_SHA"
