[project]
name = "de-toolbox"
version = "0.2.0"
description = "Shared Databricks pipeline library — medallion layers, Data Vault, Kimball, DQ, profiling."
requires-python = ">=3.11"
dependencies = [
    "pyspark>=3.5",
    "python-dateutil>=2.8",
    "pytz>=2023.3",
    "PyJWT>=2.8",
    "cryptography>=41.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/de_toolbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, no external deps",
    "integration: requires a live Spark or Databricks connection",
]
