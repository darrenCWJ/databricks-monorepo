[project]
name = "de-databricks"
version = "0.1.0"
description = "Databricks workspace admin toolkit — IAM, Unity Catalog, housekeeping, Tableau sync."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28",
    "python-dateutil>=2.8",
    "pyspark>=3.5",
    "databricks-sdk>=0.20",
    "de-toolbox",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/de_databricks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, no external deps",
    "integration: requires a live Databricks connection",
]
